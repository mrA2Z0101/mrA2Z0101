/><circle class="halo" cx="850" cy="150" r="5" style="animation-delay:-1.68s"/><circle cx="850" cy="150" r="5" fill="#7DD3FC"/><circle class="halo" cx="838" cy="220" r="5" style="animation-delay:1.92s"/><circle cx="838" cy="220" r="5" fill="#7DD3FC"/>
<circle class="ring2" cx="690" cy="150" r="58" fill="none" stroke="#7DD3FC" stroke-opacity=".35" stroke-width="1.25" stroke-dasharray="1.5 11" stroke-linecap="round"/>
<circle class="ring1" cx="690" cy="150" r="45" fill="none" stroke="#7DD3FC" stroke-opacity=".6" stroke-width="1.25" stroke-dasharray="26 10 4 10"/>
<circle cx="690" cy="150" r="34" fill="#000000" stroke="#7DD3FC" stroke-width="1.5"/>
<path class="star" d="M690 131C691.4 142.4 697.6 148.6 709 150C697.6 151.4 691.4 157.6 690 169C688.6 157.6 682.4 151.4 671 150C682.4 148.6 688.6 142.4 690 131Z" fill="#FFFFFF"/>
