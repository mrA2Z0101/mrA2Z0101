<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Aaron Zajicek, AI systems and automation">
<title>Aaron Zajicek, AI systems and automation</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.dot{animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.base{fill:none;stroke:#7DD3FC;stroke-opacity:.26;stroke-width:1.25}
.pulse{fill:none;stroke:#E0F2FE;stroke-width:2.25;stroke-linecap:round;stroke-dasharray:9 200;stroke-dashoffset:9;animation:flow 4.8s linear infinite}
@keyframes flow{0%{stroke-dashoffset:9}45%,100%{stroke-dashoffset:-100}}
.halo{fill:none;stroke:#7DD3FC;transform-box:fill-box;transform-origin:center;animation:halo 4.8s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.7}35%,100%{transform:scale(3.2);opacity:0}}
.ring1{transform-origin:690px 150px;animation:spin 22s linear infinite}
.ring2{transform-origin:690px 150px;animation:spin 34s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:glow 1.2s ease-in-out .96s infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.star{transform-origin:690px 150px;animation:beat 1.2s ease-in-out .96s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.cur{animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.ph{animation:vis 13.799999999999999s linear infinite}
@keyframes vis{0%,33.3%{opacity:1}33.34%,100%{opacity:0}}
@keyframes t0{0%{transform:translateX(0);animation-timing-function:steps(38,end)}11.565%{transform:translateX(364.8px)}23.913%{transform:translateX(364.8px);animation-timing-function:steps(38,end)}28.623%,100%{transform:translateX(0)}}
.ph0{animation-delay:0.00s}.ov0{animation:t0 13.799999999999999s linear 0.00s infinite}
@keyframes t1{0%{transform:translateX(0);animation-timing-function:steps(38,end)}11.565%{transform:translateX(364.8px)}23.913%{transform:translateX(364.8px);animation-timing-function:steps(38,end)}28.623%,100%{transform:translateX(0)}}
.ph1{animation-delay:-9.20s}.ov1{animation:t1 13.799999999999999s linear -9.20s infinite}
@keyframes t2{0%{transform:translateX(0);animation-timing-function:steps(34,end)}10.348%{transform:translateX(326.4px)}23.913%{transform:translateX(326.4px);animation-timing-function:steps(34,end)}28.623%,100%{transform:translateX(0)}}
.ph2{animation-delay:-4.60s}.ov2{animation:t2 13.799999999999999s linear -4.60s infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.ov,.ph1,.ph2,.pulse,.halo{display:none}}</style>
<defs>
<clipPath id="frame"><rect width="880" height="300" rx="14"/></clipPath>

<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#7DD3FC" fill-opacity=".34"/></pattern>
<linearGradient id="fadeg" x1="0" x2="1" y1="0" y2="0"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<mask id="fade"><rect width="880" height="300" fill="url(#fadeg)"/></mask>
<radialGradient id="core"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".34"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
<clipPath id="tz"><rect x="65.2" y="226" width="420" height="32"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="880" height="300" fill="#000000"/>

<rect width="880" height="300" fill="url(#grid)" mask="url(#fade)"/>
<circle class="glow" cx="690" cy="150" r="120" fill="url(#core)"/>
