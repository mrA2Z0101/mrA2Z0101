<text class="m" x="66" y="82" font-size="12.5" letter-spacing="3" fill="#7DD3FC">AI SYSTEMS  /  AUTOMATION</text>
<text class="s" x="46" y="148" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">Aaron Zajicek</text>
<text class="s" x="48" y="190" font-size="19" fill="#FFFFFF" fill-opacity=".72">Founder &amp; AI Engineer at Byte-Sized Wisdom</text>
