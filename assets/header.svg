<g class="ph ph0"><text class="m" x="67.2" y="247" font-size="16" fill="#7DD3FC" textLength="364.8" lengthAdjust="spacing">building agents that triage and report</text><g clip-path="url(#tz)"><g class="ov ov0"><rect x="66.2" y="228" width="440" height="28" fill="#000000"/><rect class="cur" x="68.2" y="232" width="9" height="19" fill="#7DD3FC"/></g></g></g><g class="ph ph1"><text class="m" x="67.2" y="247" font-size="16" fill="#7DD3FC" textLength="364.8" lengthAdjust="spacing">automating the busywork out of the day</text><g clip-path="url(#tz)"><g class="ov ov1"><rect x="66.2" y="228" width="440" height="28" fill="#000000"/><rect class="cur" x="68.2" y="232" width="9" height="19" fill="#7DD3FC"/></g></g></g><g class="ph ph2"><text class="m" x="67.2" y="247" font-size="16" fill="#7DD3FC" textLength="326.4" lengthAdjust="spacing">shipping tools people actually use</text><g clip-path="url(#tz)"><g class="ov ov2"><rect x="66.2" y="228" width="440" height="28" fill="#000000"/><rect class="cur" x="68.2" y="232" width="9" height="19" fill="#7DD3FC"/></g></g></g>

</g>
