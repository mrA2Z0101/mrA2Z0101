<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="Defendagotchi">
<title>Defendagotchi</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.live{animation:live 1.8s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.2}}

.pet{animation:hop 1.1s steps(2,end) infinite}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:wink 3.6s ease-in-out infinite}
@keyframes wink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.arc{fill:none;stroke:#7DD3FC;stroke-width:2;stroke-linecap:round;animation:arc 2.1s ease-in-out infinite}
@keyframes arc{0%,100%{opacity:.15}30%{opacity:1}60%{opacity:.15}}
.btn{animation:btn 4.2s steps(1,end) infinite}
@keyframes btn{0%{fill-opacity:0}6%{fill-opacity:1}14%{fill-opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.arc{opacity:.8}.btn{fill-opacity:0}}</style>
<defs>
<clipPath id="frame"><rect width="480" height="180" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="480" height="180" fill="#000000"/>

<text class="m" x="28" y="46" font-size="12.5" letter-spacing="2.4" fill="#7DD3FC">HARDWARE / ESP32</text>
<text class="s" x="27" y="91" font-size="29" font-weight="700" letter-spacing="-.5" fill="#FFFFFF">Defendagotchi</text>
<rect x="28" y="124" width="129" height="24" rx="12" fill="none" stroke="#7DD3FC" stroke-opacity=".45" stroke-width="1.25"/><circle cx="42" cy="136" r="3.5" fill="none" stroke="#7DD3FC" stroke-width="1.5"/><text class="m" x="54" y="140.2" font-size="11.5" fill="#FFFFFF" fill-opacity=".85" textLength="89.8" lengthAdjust="spacing">OPEN SOURCE</text>
<g transform="translate(286,20)">
<path class="arc" d="M78.3 24.0A9 9 0 0 1 91.7 24.0" style="animation-delay:0s"/><path class="arc" d="M72.4 18.6A17 17 0 0 1 97.6 18.6" style="animation-delay:0.28s"/><path class="arc" d="M66.4 13.3A25 25 0 0 1 103.6 13.3" style="animation-delay:0.56s"/>
<circle cx="85" cy="30" r="2.4" fill="#7DD3FC"/>
<rect x="43" y="38" width="84" height="100" rx="15" fill="#000000" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5"/>
<rect x="53" y="48" width="64" height="52" rx="5" fill="none" stroke="#7DD3FC" stroke-opacity=".7" stroke-width="1.5"/>
<g class="pet">
<rect x="74" y="58" width="5" height="6" fill="#7DD3FC"/><rect x="91" y="58" width="5" height="6" fill="#7DD3FC"/>
<rect x="70" y="63" width="30" height="24" rx="7" fill="#7DD3FC"/>
<rect class="eye" x="77" y="70" width="4.5" height="7" rx="1.5" fill="#000000"/><rect class="eye" x="88.5" y="70" width="4.5" height="7" rx="1.5" fill="#000000"/>
<rect x="74" y="87" width="7" height="4" fill="#7DD3FC"/><rect x="89" y="87" width="7" height="4" fill="#7DD3FC"/>
</g>
<circle class="btn" cx="66" cy="119" r="5.5" fill="#7DD3FC" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.5"/>
<circle class="btn" cx="85" cy="119" r="5.5" fill="#7DD3FC" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.5" style="animation-delay:1.4s"/>
<circle class="btn" cx="104" cy="119" r="5.5" fill="#7DD3FC" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.5" style="animation-delay:2.8s"/>
</g>

</g>
<rect x=".75" y=".75" width="478.5" height="178.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
