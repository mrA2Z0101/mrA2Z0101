<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="Off the Hook">
<title>Off the Hook</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.live{animation:live 1.8s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.2}}

.hook{transform-origin:122px -6px;animation:swing 3.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.scan{animation:scan 5.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}4%{opacity:1}46%{transform:translateY(84px);opacity:1}52%,100%{transform:translateY(84px);opacity:0}}
.hl{opacity:0;animation:hl 5.6s linear infinite}
@keyframes hl{0%{opacity:0}3%,82%{opacity:.95}90%,100%{opacity:0}}
.flag{transform-origin:22px 40px;animation:flag 5.6s cubic-bezier(.3,1.6,.6,1) infinite}
@keyframes flag{0%,48%{transform:scale(0)}56%,86%{transform:scale(1)}92%,100%{transform:scale(0)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.hl{opacity:.95}.scan{display:none}}</style>
<defs>
<clipPath id="frame"><rect width="480" height="180" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="480" height="180" fill="#000000"/>

<text class="m" x="28" y="46" font-size="12.5" letter-spacing="2.4" fill="#7DD3FC">BROWSER EXTENSION</text>
<text class="s" x="27" y="91" font-size="29" font-weight="700" letter-spacing="-.5" fill="#FFFFFF">Off the Hook</text>
<rect x="28" y="124" width="129" height="24" rx="12" fill="none" stroke="#7DD3FC" stroke-opacity=".45" stroke-width="1.25"/><circle cx="42" cy="136" r="3.5" fill="none" stroke="#7DD3FC" stroke-width="1.5"/><text class="m" x="54" y="140.2" font-size="11.5" fill="#FFFFFF" fill-opacity=".85" textLength="89.8" lengthAdjust="spacing">OPEN SOURCE</text>
<g transform="translate(286,20)">
<rect x="22" y="40" width="126" height="90" rx="9" fill="#000000" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
<circle cx="37" cy="56" r="6" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
<path d="M50 53H96M50 60H78" stroke="#FFFFFF" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>
<path d="M32 78H138" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/><path d="M32 90H126" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/><path d="M32 102H138" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/><path d="M32 114H104" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
<rect class="hl" x="60" y="73.5" width="54" height="9" rx="2.5" fill="#7DD3FC" style="animation-delay:.95s"/>
<rect class="hl" x="30" y="97.5" width="46" height="9" rx="2.5" fill="#7DD3FC" style="animation-delay:1.75s"/>
<rect class="hl" x="64" y="109.5" width="42" height="9" rx="2.5" fill="#7DD3FC" style="animation-delay:2.15s"/>
<path class="scan" d="M24 43H146" stroke="#7DD3FC" stroke-width="1.75" stroke-linecap="round"/>
<g class="flag"><circle cx="22" cy="40" r="11" fill="#7DD3FC"/><path d="M22 34v7" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/><circle cx="22" cy="45.6" r="1.6" fill="#000000"/></g>
<g class="hook" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M122 -6V14" stroke-opacity=".55" stroke-width="1.25"/>
<circle cx="122" cy="16.5" r="2.5"/>
<path d="M122 19v9a8.5 8.5 0 1 1-17 0v-3"/>
<path d="M105 25l-3.5 5.5M105 25l4 4.5"/>
</g>
</g>

</g>
<rect x=".75" y=".75" width="478.5" height="178.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
