@keyframes medal{0%,50%{transform:scale(.55);opacity:.35}60%,86%{transform:scale(1);opacity:1}100%{transform:scale(.55);opacity:.35}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.c{fill-opacity:var(--o)}.ring{stroke-dashoffset:0}}</style>
