<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="The Back Shots">
<title>The Back Shots</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.live{animation:live 1.8s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.2}}

.hall{transform-origin:85px 52px;animation:walk 4.8s linear infinite both}
@keyframes walk{0%{transform:scale(.12);opacity:0}12%{opacity:.85}80%{opacity:.85}100%{transform:scale(2.3);opacity:0}}
.lamp{animation:flick 3.7s steps(1,end) infinite}
@keyframes flick{0%{opacity:1}41%{opacity:.25}44%{opacity:1}47%{opacity:.15}52%{opacity:1}83%{opacity:.4}85%{opacity:1}}
.liq{animation:pour 4.8s ease-in-out infinite}
@keyframes pour{0%,8%{transform:translateY(27px)}45%,78%{transform:translateY(7px)}92%,100%{transform:translateY(27px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.hall{transform:scale(.45);opacity:.6}.hall+.hall{transform:scale(.8)}.hall+.hall+.hall{transform:scale(1.2)}.hall+.hall+.hall+.hall{transform:scale(1.7)}.liq{transform:translateY(10px)}}</style>
<defs>
<clipPath id="frame"><rect width="480" height="180" rx="14"/></clipPath>
<clipPath id="view"><rect width="170" height="140" rx="9"/></clipPath><clipPath id="glass"><path d="M72.6 78h24.8l-3.6 30h-17.6z"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="480" height="180" fill="#000000"/>

<text class="m" x="28" y="46" font-size="12.5" letter-spacing="2.4" fill="#7DD3FC">3D COMEDY HORROR</text>
<text class="s" x="27" y="91" font-size="29" font-weight="700" letter-spacing="-.5" fill="#FFFFFF">The Back Shots</text>
<rect x="28" y="124" width="187" height="24" rx="12" fill="none" stroke="#7DD3FC" stroke-opacity=".45" stroke-width="1.25"/><circle cx="42" cy="136" r="3.5" fill="none" stroke="#7DD3FC" stroke-width="1.5"/><text class="m" x="54" y="140.2" font-size="11.5" fill="#FFFFFF" fill-opacity=".85" textLength="147.9" lengthAdjust="spacing">PLAYABLE PROTOTYPE</text>
<g transform="translate(286,20)">
<g clip-path="url(#view)">
<path d="M0 0L85 52M170 0L85 52M0 140L85 52M170 140L85 52" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="1.25"/>
<rect class="hall" x="5" y="-8" width="160" height="120" fill="none" stroke="#7DD3FC" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay:-0.0s"/><rect class="hall" x="5" y="-8" width="160" height="120" fill="none" stroke="#7DD3FC" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay:-1.2s"/><rect class="hall" x="5" y="-8" width="160" height="120" fill="none" stroke="#7DD3FC" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay:-2.4s"/><rect class="hall" x="5" y="-8" width="160" height="120" fill="none" stroke="#7DD3FC" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay:-3.5999999999999996s"/>
<path class="lamp" d="M67 0h36l-6 9h-24z" fill="#FFFFFF"/>
<rect x="0" y="110" width="170" height="30" fill="#000000"/>
<path d="M0 110H170" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.5"/>
</g>
<rect x=".75" y=".75" width="168.5" height="138.5" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1.5"/>
<g clip-path="url(#glass)"><rect class="liq" x="66" y="78" width="38" height="34" fill="#7DD3FC"/></g>
<path d="M71 76h28l-4 33.5h-20z" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linejoin="round"/>
</g>

</g>
<rect x=".75" y=".75" width="478.5" height="178.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
