<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="How an automation runs: a trigger starts an agent, the agent acts, and a person gets the report">
<title>How an automation runs: a trigger starts an agent, the agent acts, and a person gets the report</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.card{fill:#7DD3FC;fill-opacity:0;stroke:#7DD3FC;stroke-opacity:.3;stroke-width:1.5;animation:act 8s ease-in-out infinite}
@keyframes act{0%{stroke-opacity:.3;fill-opacity:0}4%,20%{stroke-opacity:1;fill-opacity:.1}26%,100%{stroke-opacity:.3;fill-opacity:0}}
.ic{fill:none;stroke:#7DD3FC;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;animation:ic 8s ease-in-out infinite}
@keyframes ic{0%{stroke:#7DD3FC}4%,20%{stroke:#FFFFFF}26%,100%{stroke:#7DD3FC}}
.wire{stroke:#7DD3FC;stroke-opacity:.3;stroke-width:1.5}
.hop{fill:none;stroke:#E0F2FE;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:34 300;stroke-dashoffset:34;animation:hop 8s linear infinite}
@keyframes hop{0%,17%{stroke-dashoffset:34}26%,100%{stroke-dashoffset:-100}}
.th{fill:#FFFFFF;animation:th 1.2s ease-in-out infinite}
@keyframes th{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 8s ease-out infinite}
@keyframes draw{0%,3%{stroke-dashoffset:100}12%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.hop{display:none}.draw{stroke-dashoffset:0}}</style>
<defs>
<clipPath id="frame"><rect width="880" height="172" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="880" height="172" fill="#000000"/>
<rect class="card" x="24" y="26" width="178" height="120" rx="12" style="animation-delay:0s"/>
<text class="m" x="44" y="58" font-size="12" letter-spacing="2" fill="#7DD3FC">01</text>
<g transform="translate(156,41) scale(1.1)"><path class="ic" d="M13.5 2.5L4.5 13.5h6.5l-1.5 8 9-11h-6.5z" style="animation-delay:0s"/></g>
<text class="s" x="44" y="102" font-size="21" font-weight="600" fill="#FFFFFF">Trigger</text>
<text class="m" x="44" y="126" font-size="10.75" fill="#FFFFFF" fill-opacity=".62" textLength="141.9" lengthAdjust="spacing">webhook / email / cron</text>
<path class="wire" d="M202 86.0H242"/>
<path d="M233 81.5L240 86.0L233 90.5" fill="none" stroke="#7DD3FC" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="hop" pathLength="100" d="M202 86.0H242" style="animation-delay:0s"/>
<rect class="card" x="242" y="26" width="178" height="120" rx="12" style="animation-delay:-6s"/>
<text class="m" x="262" y="58" font-size="12" letter-spacing="2" fill="#7DD3FC">02</text>
<g transform="translate(374,41) scale(1.1)"><path class="ic" d="M12 2.5C12.8 8.4 15.6 11.2 21.5 12C15.6 12.8 12.8 15.6 12 21.5C11.2 15.6 8.4 12.8 2.5 12C8.4 11.2 11.2 8.4 12 2.5Z" style="animation-delay:-6s"/></g>
<text class="s" x="262" y="102" font-size="21" font-weight="600" fill="#FFFFFF">Agent</text>
<text class="m" x="262" y="126" font-size="10.75" fill="#FFFFFF" fill-opacity=".62" textLength="135.5" lengthAdjust="spacing">LLM + tools + context</text>
<circle class="th" cx="332" cy="95" r="2.4" style="animation-delay:0.00s"/>
<circle class="th" cx="341" cy="95" r="2.4" style="animation-delay:0.16s"/>
<circle class="th" cx="350" cy="95" r="2.4" style="animation-delay:0.32s"/>
<path class="wire" d="M420 86.0H460"/>
<path d="M451 81.5L458 86.0L451 90.5" fill="none" stroke="#7DD3FC" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="hop" pathLength="100" d="M420 86.0H460" style="animation-delay:-6s"/>
<rect class="card" x="460" y="26" width="178" height="120" rx="12" style="animation-delay:-4s"/>
<text class="m" x="480" y="58" font-size="12" letter-spacing="2" fill="#7DD3FC">03</text>
<g transform="translate(592,41) scale(1.1)"><g class="ic" style="animation-delay:-4s"><rect x="2.5" y="9" width="6" height="6" rx="1.5"/><rect x="15.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="15.5" y="15.5" width="6" height="6" rx="1.5"/><path d="M8.5 12h3.5M12 5.5v13M12 5.5h3.5M12 18.5h3.5"/></g></g>
<text class="s" x="480" y="102" font-size="21" font-weight="600" fill="#FFFFFF">Action</text>
<text class="m" x="480" y="126" font-size="10.75" fill="#FFFFFF" fill-opacity=".62" textLength="116.1" lengthAdjust="spacing">APIs / data / docs</text>
<path class="wire" d="M638 86.0H678"/>
<path d="M669 81.5L676 86.0L669 90.5" fill="none" stroke="#7DD3FC" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="hop" pathLength="100" d="M638 86.0H678" style="animation-delay:-4s"/>
<rect class="card" x="678" y="26" width="178" height="120" rx="12" style="animation-delay:-2s"/>
<text class="m" x="698" y="58" font-size="12" letter-spacing="2" fill="#7DD3FC">04</text>
<g transform="translate(810,41) scale(1.1)"><g class="ic" style="animation-delay:-2s"><circle cx="12" cy="12" r="9.5"/><path class="draw" pathLength="100" d="M7.5 12.4l3.2 3.2 6-6.6" style="animation-delay:-2s"/></g></g>
<text class="s" x="698" y="102" font-size="21" font-weight="600" fill="#FFFFFF">Report</text>
<text class="m" x="698" y="126" font-size="10.75" fill="#FFFFFF" fill-opacity=".62" textLength="109.7" lengthAdjust="spacing">human in the loop</text>
</g>
<rect x=".75" y=".75" width="878.5" height="170.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
