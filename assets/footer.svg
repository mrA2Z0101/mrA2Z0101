<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Let's build something intelligent. Get in touch at aaronzajicek.com">
<title>Let's build something intelligent. Get in touch at aaronzajicek.com</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.w{fill:none;stroke:#7DD3FC;stroke-linecap:round}
.w1{animation:w1 7s linear infinite}
.w2{animation:w2 11s linear infinite}
.w3{animation:w3 16s linear infinite reverse}
@keyframes w1{to{transform:translateX(-220px)}}
@keyframes w2{to{transform:translateX(-300px)}}
@keyframes w3{to{transform:translateX(-380px)}}
.arrow{animation:nudge 2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="frame"><rect width="880" height="200" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="880" height="200" fill="#000000"/>

<path class="w w3" d="M-380 160q95.0 -20 190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0t190.0 0" stroke-opacity=".22" stroke-width="1.25"/>
<path class="w w2" d="M-300 164q75.0 -15 150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0t150.0 0" stroke-opacity=".45" stroke-width="1.25"/>
<path class="w w1" d="M-220 168q55.0 -10 110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0t110.0 0" stroke-opacity=".9" stroke-width="1.5"/>
<text class="s" x="440" y="68" font-size="32" font-weight="700" letter-spacing="-.6" fill="#FFFFFF" text-anchor="middle">Let's build something intelligent.</text>
<text class="s" x="440" y="100" font-size="16" fill="#FFFFFF" fill-opacity=".7" text-anchor="middle">Tell me what you're trying to automate, ship, or rethink.</text>
<g>
<text class="m" x="352" y="131" font-size="13" fill="#7DD3FC" textLength="156" lengthAdjust="spacing">AARONZAJICEK.COM</text>
<path class="arrow" d="M520 126.5h13m-5-5l5 5-5 5" fill="none" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</g>
<rect x=".75" y=".75" width="878.5" height="198.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
